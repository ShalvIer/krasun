services:
  - type: web
    name: krasun-api-shalvier
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PORT
        value: "10000"
      - key: WEB_URL
        value: https://krasun-web-shalvier.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: krasun-media
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAPBOX_SERVER_TOKEN
        sync: false
      - key: ENABLE_DEV_AUTH
        value: "false"

  - type: web
    name: krasun-web-shalvier
    runtime: static
    buildCommand: npm ci && npm run build -w @krasun/web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://krasun-api-shalvier.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_ENABLE_DEV_LOGIN
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
