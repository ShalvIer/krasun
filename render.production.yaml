services:
  - type: web
    name: krasun
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: krasun-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krasun-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: krasun-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_AUTH
        value: "false"
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: SESSION_IDLE_HOURS
        value: "24"
      - key: SESSION_ABSOLUTE_DAYS
        value: "7"
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: MAPBOX_SERVER_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: krasun-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: krasun
    user: krasun
    ipAllowList: []
